name: Run Telegram Bot
on:
   schedule:
    - cron: '0 */5 * * *'
   workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository
      uses: actions/checkout@v3
      - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

     - name: Install dependencies
       run: |
         pip install pyTelegramBotAPI aiohttp

    - name: Run bot script
      run: |
        python kos2.ua
